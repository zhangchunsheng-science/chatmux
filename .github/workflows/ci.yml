name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: go vet ./...
      # timing-stress the flakiest package under runner conditions
      # (2 cores, shuffled order, repeated) before the full sweep
      - name: agent package stress
        run: |
          set -o pipefail
          GOMAXPROCS=2 go test ./internal/agent/ -count=3 -shuffle=on 2>&1 | tee stress.log
      - name: go test
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee gotest.log
      - run: go build -trimpath -ldflags "-s -w" -o chatmux .
      - name: end-to-end smoke
        run: |
          set -o pipefail
          scripts/smoke.sh 18097 2>&1 | tee smoke.log
      # ::error workflow commands create annotations directly (readable
      # via the unauthenticated annotations API) — problem matchers were
      # tried first and their file field must be a capture index, not a
      # literal path; that mistake turned ci red on v0.6.53/v0.6.54.
      - name: annotate failures
        if: failure()
        run: |
          { # whole failing-test blocks (headers, assertion output, the
            # multi-line "got:" payloads) — line-by-line greps lost them
            awk '/^--- FAIL:|^--- PASS:|^ok\t|^FAIL\t|^PASS/ && blk {blk=0} /^ *--- FAIL:/{blk=1;n=0} blk{print; if(++n>=25)blk=0}' gotest.log stress.log 2>/dev/null || true
            grep -hE '^FAIL\t|^panic: ' gotest.log stress.log 2>/dev/null || true
            grep -hE '^FAIL: ' smoke.log 2>/dev/null || true
          } | head -60 | while IFS= read -r l; do
            echo "::error file=go.mod,line=1::${l}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: chatmux-linux-amd64
          path: chatmux
