name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: go vet ./...
      # timing-stress the flakiest package under runner conditions
      # (2 cores, shuffled order, repeated) before the full sweep.
      # -race is on permanently: the tests are I/O-timing-bound so
      # instrumentation costs ~nothing locally (~54s vs ~52s), and
      # 2-core shuffled reruns are where real data races actually surface.
      - name: agent package stress
        run: |
          set -o pipefail
          GOMAXPROCS=2 go test -race ./internal/agent/ -count=3 -shuffle=on 2>&1 | tee stress.log
      - name: go test
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee gotest.log
      - run: go build -trimpath -ldflags "-s -w" -o chatmux .
      - name: end-to-end smoke
        run: |
          set -o pipefail
          scripts/smoke.sh 18097 2>&1 | tee smoke.log
      # ::error workflow commands create annotations directly (readable
      # via the unauthenticated annotations API) — problem matchers were
      # tried first and their file field must be a capture index, not a
      # literal path; that mistake turned ci red on v0.6.53/v0.6.54.
      # GitHub stores at most ~10 annotations per step: emit the
      # IDENTIFIERS first (failing test names, failing packages,
      # panics, smoke steps) and let assertion-detail blocks fill
      # whatever slots remain. A cap-truncated stream that lost the
      # test names cost a blind flake diagnosis on v0.6.64.
      - name: annotate failures
        if: failure()
        run: |
          LOGS="gotest.log stress.log"
          { # 1) identifiers: test headers, package FAILs, panics
            grep -hE '^ *--- FAIL: ' $LOGS 2>/dev/null || true
            grep -hE '^FAIL\t|^panic: ' $LOGS 2>/dev/null || true
            grep -hE '^FAIL: ' smoke.log 2>/dev/null || true
            # 2) assertion detail: whole failing-test blocks (the
            # multi-line "got:" payloads), capped per block
            awk '/^--- FAIL:|^--- PASS:|^ok\t|^FAIL\t|^PASS/ && blk {blk=0} /^ *--- FAIL:/{blk=1;n=0} blk{print; if(++n>=25)blk=0}' $LOGS 2>/dev/null || true
          } | head -10 | while IFS= read -r l; do
            echo "::error file=go.mod,line=1::${l}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: chatmux-linux-amd64
          path: chatmux
