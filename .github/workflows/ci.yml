name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -ldflags "-s -w" -o chatmux .
      - uses: actions/upload-artifact@v4
        with:
          name: chatmux-linux-amd64
          path: chatmux
