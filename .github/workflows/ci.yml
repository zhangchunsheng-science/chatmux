name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: go vet ./...
      - run: echo "::add-matcher::.github/matchers/gotest.json"
      - run: go test ./...
      - run: echo "::remove-matcher owner=gotest-fail::" && echo "::remove-matcher owner=gotest-pkgfail::" && echo "::remove-matcher owner=gotest-panic::"
      - run: go build -trimpath -ldflags "-s -w" -o chatmux .
      - name: end-to-end smoke
        run: |
          echo "::add-matcher::.github/matchers/smoke.json"
          scripts/smoke.sh 18097
      - uses: actions/upload-artifact@v4
        with:
          name: chatmux-linux-amd64
          path: chatmux
