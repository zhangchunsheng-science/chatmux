name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          [ "$GOOS" = windows ] && ext=".exe"
          go build -trimpath -ldflags "-s -w" -o "chatmux-${GOOS}-${GOARCH}${ext}" .
      - name: package
        run: |
          ext=""
          [ "${{ matrix.goos }}" = windows ] && ext=".exe"
          if [ "${{ matrix.goos }}" = windows ]; then
            zip "chatmux-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "chatmux-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          else
            tar czf "chatmux-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "chatmux-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: chatmux-${{ matrix.goos }}-${{ matrix.goarch }}.*

  # One uploader, no matrix races: every archive and its sidecar is
  # computed and published in a single pass, and any assets from a
  # previous publish of this tag are cleared first so a re-run can
  # never leave a mix of builds (which the updater's checksum
  # verification would correctly refuse).
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          for f in chatmux-linux-* chatmux-darwin-* chatmux-windows-*; do
            sha256sum "$f" > "$f.sha256"
          done
      - name: clear stale release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RID=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            | jq -r '.id // empty')
          if [ -n "$RID" ]; then
            curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/$RID/assets?per_page=100" \
              | jq -r '.[].id' \
              | while read -r aid; do
                  curl -sf -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                    "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/$aid" || true
                done
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/chatmux-*
