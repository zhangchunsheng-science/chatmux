name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          [ "$GOOS" = windows ] && ext=".exe"
          go build -trimpath -ldflags "-s -w" -o "chatmux-${GOOS}-${GOARCH}${ext}" .
      - name: package
        run: |
          ext=""
          [ "${{ matrix.goos }}" = windows ] && ext=".exe"
          if [ "${{ matrix.goos }}" = windows ]; then
            zip "chatmux-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "chatmux-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          else
            tar czf "chatmux-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "chatmux-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: chatmux-${{ matrix.goos }}-${{ matrix.goarch }}.*
