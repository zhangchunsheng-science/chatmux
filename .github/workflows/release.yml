name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          [ "$GOOS" = windows ] && ext=".exe"
          go build -trimpath -ldflags "-s -w" -o "chatmux-${GOOS}-${GOARCH}${ext}" .
      - name: package
        run: |
          ext=""
          [ "${{ matrix.goos }}" = windows ] && ext=".exe"
          if [ "${{ matrix.goos }}" = windows ]; then
            zip "chatmux-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "chatmux-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
            sha256sum "chatmux-${{ matrix.goos }}-${{ matrix.goarch }}.zip" > "chatmux-${{ matrix.goos }}-${{ matrix.goarch }}.zip.sha256"
          else
            tar czf "chatmux-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "chatmux-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
            sha256sum "chatmux-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" > "chatmux-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256"
          fi
      # Re-publish safety: if this tag's release already has assets (a
      # re-tag or workflow re-run), the release action would skip
      # same-named uploads and leave a mix of builds — which the
      # updater's checksum verification then (correctly) refuses.
      # Clear them so every upload below is one consistent set.
      - name: clear stale release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RID=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            | jq -r '.id // empty')
          if [ -n "$RID" ]; then
            curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/$RID/assets?per_page=100" \
              | jq -r '.[].id' \
              | while read -r aid; do
                  curl -sf -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                    "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/$aid" || true
                done
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: chatmux-${{ matrix.goos }}-${{ matrix.goarch }}.*
